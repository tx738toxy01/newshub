<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsHub</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%233b82f6'/><text x='16' y='22.5' font-family='system-ui,-apple-system,sans-serif' font-size='18' font-weight='900' fill='white' text-anchor='middle'>N</text></svg>">
    <meta name="theme-color" content="#090d16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #090d16;
            --surface: #111827;
            --surface-hover: #1f2937;
            --primary: #f8fafc;
            --primary-accent: #3b82f6;
            --primary-accent-hover: #60a5fa;
            --accent-soft: rgba(59, 130, 246, 0.16);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-focus: #374151;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -2px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 24px -4px rgba(0, 0, 0, 0.6), 0 4px 8px -4px rgba(0, 0, 0, 0.4);
            --shadow-xl: 0 24px 48px -12px rgba(0, 0, 0, 0.85);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --transition-smooth: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-light);
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-menu {
            background: transparent;
            border: 1px solid transparent;
            color: var(--primary);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-menu:hover {
            background: var(--surface-hover);
            border-color: var(--border-light);
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .logo-badge {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.6px;
            color: var(--primary);
        }

        .logo-text span {
            color: var(--primary-accent);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-action {
            background: var(--surface);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            padding: 0;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .btn-action:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
            color: var(--primary-accent);
            box-shadow: var(--shadow-md);
        }

        .sources-sidebar {
            position: fixed;
            top: 0;
            right: -360px;
            width: 340px;
            max-width: 86vw;
            height: 100vh;
            background: var(--surface);
            box-shadow: var(--shadow-xl);
            z-index: 999;
            padding: 24px 20px;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sources-sidebar.show {
            transform: translateX(-360px);
        }

        .source-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-light);
        }

        .source-controls button {
            flex: 1;
            padding: 7px 12px;
            background: var(--bg-page);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-main);
            transition: var(--transition-smooth);
        }

        .source-controls button:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
        }

        .source-group {
            margin-bottom: 16px;
        }

        .group-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            padding-left: 2px;
        }

        .group-title label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: color 0.15s;
        }

        .group-title label:hover {
            color: var(--primary-accent);
        }

        .group-title input, .source-item input {
            appearance: none;
            -webkit-appearance: none;
            width: 17px;
            height: 17px;
            border: 1.5px solid #374151;
            border-radius: 5px;
            cursor: pointer;
            outline: none;
            display: inline-grid;
            place-content: center;
            transition: var(--transition-smooth);
            background: #1f2937;
            margin: 0;
        }

        .group-title input:checked, .source-item input:checked {
            background: var(--primary-accent);
            border-color: var(--primary-accent);
        }

        .group-title input:checked::before, .source-item input:checked::before {
            content: "";
            width: 9px;
            height: 5px;
            border-left: 2px solid white;
            border-bottom: 2px solid white;
            transform: rotate(-45deg) translate(1px, -1px);
        }

        .source-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .source-item:hover {
            background: var(--bg-page);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 998;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .sidebar-overlay.show {
            display: block;
            opacity: 1;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -340px;
            width: 320px;
            max-width: 86vw;
            height: 100vh;
            background: var(--surface);
            box-shadow: var(--shadow-xl);
            z-index: 999;
            padding: 24px 20px;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar.show {
            transform: translateX(340px);
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-light);
            gap: 10px;
        }

        .lang-switch {
            display: inline-flex;
            background: var(--bg-page);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-full);
            padding: 2px;
            gap: 2px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .lang-btn:hover {
            color: var(--text-main);
        }

        .lang-btn.active {
            background: var(--primary-accent);
            color: white;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        .sidebar-title {
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .sidebar-close {
            background: var(--bg-page);
            border: 1px solid var(--border-light);
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition-smooth);
        }

        .sidebar-close:hover {
            background: var(--surface-hover);
            color: var(--text-main);
        }

        .menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu li {
            padding: 10px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.92rem;
            color: var(--text-main);
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu li:hover {
            background: var(--bg-page);
            color: var(--primary-accent);
        }

        .menu li.active {
            background: var(--primary-accent);
            color: white;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        .layout {
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px 32px 64px 32px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-light);
        }

        .content-header h2 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .content-header h2 svg {
            width: 28px;
            height: 28px;
            color: var(--primary-accent);
            flex-shrink: 0;
        }

        .menu li svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            color: var(--text-muted);
            transition: color 0.15s;
        }

        .menu li:hover svg {
            color: var(--primary-accent);
        }

        .menu li.active svg {
            color: white;
        }

        .status-text {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--surface);
            padding: 6px 14px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }

        .new-articles-pill {
            position: fixed;
            top: 76px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--primary-accent);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-full);
            padding: 10px 22px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
            z-index: 900;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .new-articles-pill.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .new-articles-pill:hover {
            background: var(--primary-accent-hover);
            transform: translateX(-50%) translateY(-2px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            transition: var(--transition-smooth);
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-sm);
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: var(--shadow-lg);
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 54%;
            background-color: #1f2937;
            overflow: hidden;
        }

        .card-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover .card-img {
            transform: scale(1.04);
        }

        .card-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .badges-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .card-badge {
            background: var(--bg-page);
            color: var(--text-muted);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .card-badge.accent {
            background: var(--accent-soft);
            color: var(--primary-accent);
            border-color: transparent;
        }

        .card-title {
            font-size: 0.94rem;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 8px;
            color: var(--primary);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.15s;
        }

        .card:hover .card-title {
            color: var(--primary-accent);
        }

        .card-desc {
            display: none;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-light);
            padding-top: 10px;
            font-size: 0.72rem;
            margin-top: auto;
        }

        .card-date {
            color: var(--text-subtle);
            font-weight: 600;
        }

        .card-link {
            display: none;
        }

        .grid.list-view {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .grid.list-view .card {
            flex-direction: row;
            height: 120px;
            border-radius: var(--radius-md);
        }

        .grid.list-view .card-img-wrapper {
            width: 160px;
            padding-top: 0;
            height: 100%;
            flex-shrink: 0;
        }

        .grid.list-view .card-content {
            padding: 12px 18px;
            justify-content: space-between;
        }

        .grid.list-view .badges-row {
            margin-bottom: 4px;
        }

        .grid.list-view .card-badge {
            font-size: 0.65rem;
            padding: 2px 7px;
        }

        .grid.list-view .card-title {
            font-size: 0.98rem;
            line-height: 1.35;
            margin-bottom: 0;
            -webkit-line-clamp: 2;
        }

        .grid.list-view .card-desc {
            display: none;
        }

        .grid.list-view .card-footer {
            border-top: none;
            padding-top: 0;
            font-size: 0.74rem;
        }

        .loader {
            grid-column: 1 / -1;
            padding: 80px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
        }

        .spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid rgba(59, 130, 246, 0.15);
            border-radius: 50%;
            border-top-color: var(--primary-accent);
            animation: spin 0.8s ease-in-out infinite;
            margin-bottom: 14px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 60px 24px;
            text-align: center;
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--border-focus);
            color: var(--text-muted);
            font-weight: 500;
        }

        @media (max-width: 768px) {
            header {
                padding: 10px 16px;
            }
            .layout {
                padding: 20px 16px 40px 16px;
            }
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .grid.list-view .card {
                height: 105px;
            }
            .grid.list-view .card-img-wrapper {
                width: 110px;
            }
            .grid.list-view .card-content {
                padding: 10px 12px;
            }
            .grid.list-view .card-title {
                font-size: 0.85rem;
            }
            .content-header h2 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <button class="btn-menu" id="menu-btn" onclick="toggleSidebar()" aria-label="Menu">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="7" x2="20" y2="7"></line>
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="17" x2="20" y2="17"></line>
                </svg>
            </button>
            <div class="logo-wrap">
                <div class="logo-badge">N</div>
                <div class="logo-text">News<span>Hub</span></div>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-action" id="view-toggle-btn" onclick="toggleView()" aria-label="Zobrazenie">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </button>
            <button class="btn-action" id="sources-btn" onclick="toggleSourcesSidebar()" aria-label="Zdroje správ">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
    </header>

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeAllSidebars()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title" id="sidebar-title">Sekcie správ</div>
            <div class="lang-switch">
                <button class="lang-btn" id="lang-btn-sk" onclick="setLanguage('sk')">SK</button>
                <button class="lang-btn" id="lang-btn-en" onclick="setLanguage('en')">EN</button>
            </div>
            <button class="sidebar-close" onclick="toggleSidebar(false)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <ul class="menu" id="categories-menu"></ul>
    </aside>

    <aside class="sources-sidebar" id="sources-sidebar">
        <div class="sidebar-header">

        function cleanHtml(rawHtml, sourceName = '') {
            if (!rawHtml) return '';
            const doc = new DOMParser().parseFromString(rawHtml, 'text/html');
            let text = (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
            if (sourceName && text.endsWith(sourceName)) {
                text = text.slice(0, -sourceName.length).replace(/[-–—|\s]+$/, '').trim();
            }
            return text.length > 150 ? text.substring(0, 150) + '...' : text;
        }

        function cleanTitle(rawTitle, sourceName = '') {
            if (!rawTitle) return 'Bez názvu';
            let title = rawTitle.trim();
            if (sourceName) {
                const parts = title.split(/\s+[-–—|]\s+/);
                if (parts.length > 1) {
                    const lastPart = parts[parts.length - 1].toLowerCase();
                    const srcLower = sourceName.toLowerCase().replace(/\.(sk|cz|com|uk|org)$/i, '');
                    if (lastPart.includes(srcLower) || srcLower.includes(lastPart)) {
                        parts.pop();
                        title = parts.join(' - ').trim();
                    }
                }
            }
            return title || 'Bez názvu';
        }

        function extractImageFromJson(item) {
            if (item.enclosure && item.enclosure.link && (!item.enclosure.type || item.enclosure.type.includes('image'))) {
                return item.enclosure.link;
            }
            if (item.thumbnail) return item.thumbnail;
            const match = (item.description || item.content || '').match(/<img[^>]+src=["']([^"']+)["']/i);
            if (match && match[1] && !match[1].includes('googleusercontent.com/J6_coFbogxhRI9iM864NL_liGXvsQp2AupsKei7z0cNNfDvGUmWUy20nuUhkREQyrpY4bEeIBuc=s0-w300')) {
                return match[1];
            }
            return DEFAULT_IMAGE;
        }

        function extractImageFromXmlItem(item, description) {
            const enclosure = item.querySelector('enclosure');
            if (enclosure) {
                const type = enclosure.getAttribute('type') || '';
                const url = enclosure.getAttribute('url');
                if (url && (!type || type.includes('image'))) return url;
            }

            const mediaContents = item.getElementsByTagName('media:content');
            for (let i = 0; i < mediaContents.length; i++) {
                const url = mediaContents[i].getAttribute('url');
                const medium = mediaContents[i].getAttribute('medium') || '';
                const type = mediaContents[i].getAttribute('type') || '';
                if (url && (!medium || medium === 'image' || type.includes('image'))) return url;
            }

            const mediaThumbnails = item.getElementsByTagName('media:thumbnail');
            if (mediaThumbnails.length > 0 && mediaThumbnails[0].getAttribute('url')) {
                return mediaThumbnails[0].getAttribute('url');
            }

            const encodedContent = item.getElementsByTagName('content:encoded')[0]?.textContent || '';
            const combinedHtml = description + ' ' + encodedContent;
            const imgMatch = combinedHtml.match(/<img[^>]+src=["']([^"']+)["']/i);
            if (imgMatch && imgMatch[1] && !imgMatch[1].includes('lh3.googleusercontent.com/J6_coFbogxhRI9iM864NL_liGXvsQp2AupsKei7z0cNNfDvGUmWUy20nuUhkREQyrpY4bEeIBuc')) {
                return imgMatch[1];
            }

            return DEFAULT_IMAGE;
        }

        function decodeAllOriginsContents(contents) {
            if (!contents || typeof contents !== 'string') return '';
            if (contents.startsWith('data:') && contents.includes(';base64,')) {
                try {
                    const base64 = contents.split(';base64,')[1];
                    const binStr = atob(base64);
                    const bytes = new Uint8Array(binStr.length);
                    for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                    return new TextDecoder('utf-8').decode(bytes);
                } catch (e) {
                    return '';
                }
            }
            return contents;
        }

        function parseXmlToArticles(xmlString, src) {
            if (!xmlString || typeof xmlString !== 'string') return [];
            const cleanedXml = xmlString.trim().replace(/^[^<]+/, '');
            if (!cleanedXml) return [];

            const parser = new DOMParser();
            let xmlDoc = parser.parseFromString(cleanedXml, "text/xml");
            let items = Array.from(xmlDoc.querySelectorAll("item, entry"));

            if (items.length === 0) {
                const sanitized = cleanedXml.replace(/&(?!(?:apos|quot|[gl]t|amp|#\d+|#x[0-9a-fA-F]+);)/g, '&amp;');
                xmlDoc = parser.parseFromString(sanitized, "text/xml");
                items = Array.from(xmlDoc.querySelectorAll("item, entry"));
            }

            if (items.length === 0) {
                xmlDoc = parser.parseFromString(cleanedXml, "text/html");
                items = Array.from(xmlDoc.querySelectorAll("item, entry"));
            }

            if (items.length === 0) return [];

            return items.slice(0, 25).map(item => {
                const rawTitle = item.querySelector('title')?.textContent || 'Bez názvu';
                const title = cleanTitle(rawTitle, src.name);

                let link = item.querySelector('link')?.textContent?.trim();
                if (!link) {
                    const linkEl = item.querySelector('link');
                    if (linkEl) {
                        link = linkEl.getAttribute('href') || linkEl.nextSibling?.nodeValue?.trim() || '';
                    }
                }
                if (!link || !link.startsWith('http')) {
                    const guid = item.querySelector('guid')?.textContent?.trim();
                    if (guid && guid.startsWith('http')) link = guid;
                }
                if (!link) link = '#';

                const pubDateRaw = item.querySelector('pubDate, pubdate, updated, published')?.textContent ||
                                   item.getElementsByTagName('dc:date')[0]?.textContent;
                const parsedDate = pubDateRaw ? new Date(pubDateRaw) : new Date();
                const description = item.querySelector('description, summary, content')?.textContent || '';

                const categoryTags = Array.from(item.querySelectorAll('category'))
                    .map(c => (c.textContent || c.getAttribute('term') || '').toLowerCase().trim())
                    .filter(Boolean);

                const cleanedDesc = cleanHtml(description, src.name);

                return {
                    sourceId: src.id,
                    sourceName: src.name,
                    sourceDefaultCats: src.defaultCats || [],
                    title: title,
                    link: link,
                    pubDate: isNaN(parsedDate.getTime()) ? new Date() : parsedDate,
                    description: cleanedDesc === title ? '' : cleanedDesc,
                    categories: categoryTags,
                    image: extractImageFromXmlItem(item, description)
                };
            });
        }

        const SOURCE_CACHE_TTL = 5 * 60 * 1000;
        let sourceFetchTimes = {};

        try {
            const savedTimes = localStorage.getItem('newshub_source_times');
            if (savedTimes) sourceFetchTimes = JSON.parse(savedTimes);
        } catch (e) {}

        async function fetchWithTimeout(url, parentSignal, timeoutMs = 2600) {
            const controller = new AbortController();
            const onAbort = () => controller.abort();
            if (parentSignal) {
                if (parentSignal.aborted) throw new DOMException('Aborted', 'AbortError');
                parentSignal.addEventListener('abort', onAbort, { once: true });
            }
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                return await fetch(url, { signal: controller.signal });
            } finally {
                clearTimeout(timer);
                if (parentSignal) parentSignal.removeEventListener('abort', onAbort);
            }
        }

        async function fetchViaCodeTabs(feedUrl, src, signal) {
            const res = await fetchWithTimeout(`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(feedUrl)}`, signal);
            if (!res.ok) throw new Error('Failed');
            const xml = await res.text();
            const articles = parseXmlToArticles(xml, src);
            if (!articles || articles.length === 0) throw new Error('No articles');
            return articles;
        }

        async function fetchViaAllOrigins(feedUrl, src, signal) {
            const res = await fetchWithTimeout(`https://api.allorigins.win/get?url=${encodeURIComponent(feedUrl)}`, signal);
            if (!res.ok) throw new Error('Failed');
            const json = await res.json();
            const xml = decodeAllOriginsContents(json.contents);
            const articles = parseXmlToArticles(xml, src);
            if (!articles || articles.length === 0) throw new Error('No articles');
            return articles;
        }

        async function fetchViaRss2Json(feedUrl, src, signal) {
            const res = await fetchWithTimeout(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`, signal);
            if (!res.ok) throw new Error('Failed');
            const json = await res.json();
            if (json.status !== 'ok' || !json.items || json.items.length === 0) throw new Error('No articles');
            return json.items.map(i => {
                const parsedDate = i.pubDate ? new Date(i.pubDate.replace(' ', 'T')) : new Date();
                const title = cleanTitle(i.title, src.name);
                const desc = cleanHtml(i.description || i.content, src.name);
                return {
                    sourceId: src.id,
                    sourceName: src.name,
                    sourceDefaultCats: src.defaultCats || [],
                    title: title,
                    link: i.link || '#',
                    pubDate: isNaN(parsedDate.getTime()) ? (i.pubDate ? new Date(i.pubDate) : new Date()) : parsedDate,
                    description: desc === title ? '' : desc,
                    categories: i.categories ? i.categories.map(c => c.toLowerCase().trim()) : [],
                    image: extractImageFromJson(i)
                };
            });
        }

        async function fetchViaCorsProxy(feedUrl, src, signal) {
            const res = await fetchWithTimeout(`https://corsproxy.io/?url=${encodeURIComponent(feedUrl)}`, signal);
            if (!res.ok) throw new Error('Failed');
            const xml = await res.text();
            const articles = parseXmlToArticles(xml, src);
            if (!articles || articles.length === 0) throw new Error('No articles');
            return articles;
        }

        async function fetchViaCorsLol(feedUrl, src, signal) {
            const res = await fetchWithTimeout(`https://api.cors.lol/?url=${encodeURIComponent(feedUrl)}`, signal);
            if (!res.ok) throw new Error('Failed');
            const xml = await res.text();
            const articles = parseXmlToArticles(xml, src);
            if (!articles || articles.length === 0) throw new Error('No articles');
            return articles;
        }

        async function raceProxies(feedUrl, src, parentSignal) {
            const raceController = new AbortController();
            const onParentAbort = () => raceController.abort();
            if (parentSignal) {
                if (parentSignal.aborted) throw new DOMException('Aborted', 'AbortError');
                parentSignal.addEventListener('abort', onParentAbort, { once: true });
            }

            const candidates = [
                fetchViaCodeTabs(feedUrl, src, raceController.signal),
                fetchViaAllOrigins(feedUrl, src, raceController.signal),
                fetchViaRss2Json(feedUrl, src, raceController.signal),
                fetchViaCorsProxy(feedUrl, src, raceController.signal),
                fetchViaCorsLol(feedUrl, src, raceController.signal)
            ];

            try {
                const winner = await Promise.any(candidates);
                raceController.abort();
                return winner;
            } catch (e) {
                raceController.abort();
                return [];
            } finally {
                if (parentSignal) parentSignal.removeEventListener('abort', onParentAbort);
            }
        }

        function buildFallbackFeedUrl(src) {
            try {
                const domain = src.domain || new URL(src.url).hostname.replace(/^www\.|^spravy\.|^servis\.|^vyber\.|^feeds\.|^rss\./i, '');
                if (src.lang === 'sk') {
                    return `https://news.google.com/rss/search?q=site:${encodeURIComponent(domain)}&hl=sk&gl=SK&ceid=SK:sk`;
                }
                if (src.lang === 'cz') {
                    return `https://news.google.com/rss/search?q=site:${encodeURIComponent(domain)}&hl=cs&gl=CZ&ceid=CZ:cs`;
                }
                return `https://news.google.com/rss/search?q=site:${encodeURIComponent(domain)}&hl=en-US&gl=US&ceid=US:en`;
            } catch (e) {
                return '';
            }
        }

        async function fetchNewsForSource(src, signal) {
            const lastFetched = sourceFetchTimes[src.id] || 0;
            const isFresh = (Date.now() - lastFetched) < SOURCE_CACHE_TTL;
            if (isFresh) {
                const cached = rawArticlesCache.filter(a => a.sourceId === src.id);
                if (cached.length > 0) return cached;
            }

            let articles = await raceProxies(src.url, src, signal);
            if (!articles || articles.length === 0) {
                const fallbackUrl = buildFallbackFeedUrl(src);
                if (fallbackUrl) {
                    articles = await raceProxies(fallbackUrl, src, signal);
                }
            }

            if (articles && articles.length > 0) {
                sourceFetchTimes[src.id] = Date.now();
                try {
                    localStorage.setItem('newshub_source_times', JSON.stringify(sourceFetchTimes));
                } catch (e) {}
                return articles;
            }

            return [];
        }

        async function fetchNews() {
            const checkedSources = getCheckedSources();
            const grid = document.getElementById('news-grid');
            const status = document.getElementById('status-text');
            const t = i18n[currentLang];

            fetchController.abort();
            fetchController = new AbortController();
            const signal = fetchController.signal;

            if (checkedSources.length === 0) {
                grid.innerHTML = `<div class="empty-state">${t.selectSourceMsg}</div>`;
                status.innerText = t.noSource;
                return;
            }

            const checkedIds = new Set(checkedSources.map(s => s.id));
            const hasVisibleArticles = rawArticlesCache.some(a => checkedIds.has(a.sourceId));

            if (!hasVisibleArticles) {
                grid.innerHTML = `
                    <div class="loader">
                        <div class="spinner"></div>
                        <div>${t.loadingSources}</div>
                    </div>
                `;
                status.innerText = t.progressCount(t.loading, 0, checkedSources.length);
            } else {
                status.innerText = t.progressCount(t.fastUpdate, 0, checkedSources.length);
            }

            let completedCount = 0;
            const concurrency = 12;
            const queue = [...checkedSources];

            async function worker() {
                while (queue.length > 0) {
                    if (signal.aborted) return;
                    const src = queue.shift();
                    try {
                        const res = await fetchNewsForSource(src, signal);
                        if (signal.aborted) return;
                        completedCount++;
                        if (res.length > 0) {
                            const currentTopLink = articlesCache[0]?.link;
                            const map = new Map();
                            rawArticlesCache.forEach(a => map.set(a.link, a));
                            res.forEach(a => map.set(a.link, a));
                            rawArticlesCache = Array.from(map.values());
                            rawArticlesCache.sort((a, b) => b.pubDate - a.pubDate);
                            if (rawArticlesCache.length > 300) {
                                rawArticlesCache = rawArticlesCache.slice(0, 300);
                            }
                            saveCachedArticles();

                            if (articlesCache.length === 0) {
                                applyFilterAndRender(completedCount < checkedSources.length, completedCount, checkedSources.length);
                            } else {
                                const freshFiltered = getFilteredArticles();
                                if (freshFiltered.length > 0 && freshFiltered[0].link !== currentTopLink) {
                                    const pill = document.getElementById('new-articles-pill');
                                    if (pill) pill.classList.add('show');
                                }
                                if (completedCount < checkedSources.length) {
                                    status.innerText = t.progressCount(t.updating, completedCount, checkedSources.length);
                                } else {
                                    status.innerText = t.shownCount(articlesCache.length);
                                }
                            }
                        } else {
                            if (hasVisibleArticles) {
                                status.innerText = t.progressCount(t.updating, completedCount, checkedSources.length);
                            } else {
                                status.innerText = t.progressCount(t.loading, completedCount, checkedSources.length);
                            }
                        }
                    } catch (e) {
                        if (e.name === 'AbortError' || signal.aborted) return;
                        completedCount++;
                    }
                }
            }

            try {
                const workers = Array.from({ length: Math.min(concurrency, checkedSources.length) }, () => worker());
                await Promise.all(workers);
                if (!signal.aborted && articlesCache.length === 0) {
                    applyFilterAndRender(false, completedCount, checkedSources.length);
                } else if (!signal.aborted) {
                    status.innerText = t.shownCount(articlesCache.length);
                }
            } catch (e) {
                if (e.name !== 'AbortError' && !signal.aborted) {
                    if (!hasVisibleArticles) {
                        grid.innerHTML = `<div class="empty-state">${t.errorMsg}</div>`;
                        status.innerText = t.error;
                    }
                }
            }
        }

        function getFilteredArticles() {
            const checkedSources = getCheckedSources();
            if (checkedSources.length === 0) return [];
            const checkedIds = new Set(checkedSources.map(s => s.id));
            let validArticles = rawArticlesCache.filter(a => checkedIds.has(a.sourceId));
            if (validArticles.length === 0) return [];

            const catInfo = categories.find(c => c.id === activeCategory);
            if (activeCategory !== 'all' && catInfo && catInfo.tags.length > 0) {
                return validArticles.filter(article => {
                    const articleCats = article.categories.join(' ');
                    const articleTitle = article.title.toLowerCase();
                    const articleDesc = article.description.toLowerCase();

                    const matchesKeyword = catInfo.tags.some(tag =>
                        articleCats.includes(tag) ||
                        articleTitle.includes(tag) ||
                        articleDesc.includes(tag)
                    );

                    if (matchesKeyword) return true;

                    if (article.categories.length === 0 && article.sourceDefaultCats && article.sourceDefaultCats.includes(activeCategory)) {
                        return true;
                    }

                    return false;
                });
            }
            return validArticles;
        }

        function applyFilterAndRender(isStillLoading = false, completed = 0, total = 0) {
            const grid = document.getElementById('news-grid');
            const status = document.getElementById('status-text');
            const checkedSources = getCheckedSources();
            const t = i18n[currentLang];

            if (checkedSources.length === 0) {
                grid.innerHTML = `<div class="empty-state">${t.selectSourceMsg}</div>`;
                status.innerText = t.noSource;
                return;
            }

            const checkedIds = new Set(checkedSources.map(s => s.id));
            let validArticles = rawArticlesCache.filter(a => checkedIds.has(a.sourceId));

            if (validArticles.length === 0) {
                if (!isStillLoading) {
                    grid.innerHTML = `<div class="empty-state">${t.blockedMsg}</div>`;
                    status.innerText = t.noSource;
                }
                return;
            }

            let filteredArticles = getFilteredArticles();

            if (filteredArticles.length === 0 && activeCategory !== 'all') {
                const catInfo = categories.find(c => c.id === activeCategory);
                const catName = catInfo ? catInfo.name[currentLang] : '';
                if (!isStillLoading) {
                    grid.innerHTML = `<div class="empty-state">${t.noCategoryArticles(catName)}</div>`;
                    status.innerText = t.shownCount(0);
                }
                articlesCache = [];
                return;
            }

            articlesCache = filteredArticles.slice(0, 100);
            if (isStillLoading) {
                status.innerText = `${t.updating} (${completed}/${total}) • ${t.shownCount(articlesCache.length)}`;
            } else {
                status.innerText = t.shownCount(articlesCache.length);
            }
            renderArticles();
        }

        function renderArticles() {
            const grid = document.getElementById('news-grid');

            if (articlesCache.length === 0) {
                return;
            }

            const t = i18n[currentLang];

            grid.innerHTML = articlesCache.map(article => {
                const dateObj = isNaN(article.pubDate) ? new Date() : article.pubDate;
                const dateStr = dateObj.toLocaleDateString(t.locale);
                const timeStr = dateObj.toLocaleTimeString(t.locale, { hour: '2-digit', minute: '2-digit' });

                const categoryBadge = article.categories.length > 0
                    ? `<span class="card-badge">${article.categories[0]}</span>`
                    : '';

                return `
                    <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="card">
                        <div class="card-img-wrapper">
                            <img src="${article.image}" alt="Náhľad článku" class="card-img" loading="lazy" onerror="this.src='${DEFAULT_IMAGE}'">
                        </div>
                        <div class="card-content">
                            <div class="badges-row">
                                <span class="card-badge accent">${article.sourceName}</span>
                                ${categoryBadge}
                            </div>
                            <h3 class="card-title">${article.title}</h3>
                            <p class="card-desc">${article.description}</p>
                            <div class="card-footer">
                                <span class="card-date">${dateStr} &bull; ${timeStr}</span>
                                <span class="card-link">${t.readMore}</span>
                            </div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        initUI();
    </script>
</body>
</html>
