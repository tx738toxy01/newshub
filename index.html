<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsHub</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%233b82f6'/><text x='16' y='22.5' font-family='system-ui,-apple-system,sans-serif' font-size='18' font-weight='900' fill='white' text-anchor='middle'>N</text></svg>">
    <meta name="theme-color" content="#090d16">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Outfit:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #090d16;
            --surface: #111827;
            --surface-hover: #1f2937;
            --primary: #f8fafc;
            --primary-accent: #3b82f6;
            --primary-accent-hover: #60a5fa;
            --accent-soft: rgba(59, 130, 246, 0.16);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-focus: #374151;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -2px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 24px -4px rgba(0, 0, 0, 0.6), 0 4px 8px -4px rgba(0, 0, 0, 0.4);
            --shadow-xl: 0 24px 48px -12px rgba(0, 0, 0, 0.85);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --transition-smooth: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 13, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-light);
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-menu {
            background: transparent;
            border: 1px solid transparent;
            color: var(--primary);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-menu:hover {
            background: var(--surface-hover);
            border-color: var(--border-light);
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .logo-badge {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1rem;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.6px;
            color: var(--primary);
        }

        .logo-text span {
            color: var(--primary-accent);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-action {
            background: var(--surface);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            padding: 0;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }

        .btn-action:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
            color: var(--primary-accent);
            box-shadow: var(--shadow-md);
        }

        .sources-sidebar {
            position: fixed;
            top: 0;
            right: -360px;
            width: 340px;
            max-width: 86vw;
            height: 100vh;
            background: var(--surface);
            box-shadow: var(--shadow-xl);
            z-index: 999;
            padding: 24px 20px;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sources-sidebar.show {
            transform: translateX(-360px);
        }

        .source-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-light);
        }

        .source-controls button {
            flex: 1;
            padding: 7px 12px;
            background: var(--bg-page);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-main);
            transition: var(--transition-smooth);
        }

        .source-controls button:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
        }

        .source-group {
            margin-bottom: 16px;
        }

        .group-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
            padding-left: 2px;
        }

        .group-title label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: color 0.15s;
        }

        .group-title label:hover {
            color: var(--primary-accent);
        }

        .group-title input, .source-item input {
            appearance: none;
            -webkit-appearance: none;
            width: 17px;
            height: 17px;
            border: 1.5px solid #374151;
            border-radius: 5px;
            cursor: pointer;
            outline: none;
            display: inline-grid;
            place-content: center;
            transition: var(--transition-smooth);
            background: #1f2937;
            margin: 0;
        }

        .group-title input:checked, .source-item input:checked {
            background: var(--primary-accent);
            border-color: var(--primary-accent);
        }

        .group-title input:checked::before, .source-item input:checked::before {
            content: "";
            width: 9px;
            height: 5px;
            border-left: 2px solid white;
            border-bottom: 2px solid white;
            transform: rotate(-45deg) translate(1px, -1px);
        }

        .source-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-main);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .source-item:hover {
            background: var(--bg-page);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 998;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .sidebar-overlay.show {
            display: block;
            opacity: 1;
        }

        .categories-bar {
            position: sticky;
            top: 65px;
            z-index: 95;
            background: rgba(9, 13, 22, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-light);
            padding: 6px 20px;
        }

        .categories-nav {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            max-width: 1440px;
            margin: 0 auto;
        }

        .cat-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 4px;
            height: 38px;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition-smooth);
            font-size: 0.78rem;
            font-weight: 700;
            user-select: none;
            width: 100%;
        }

        .cat-btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .cat-btn span {
            display: none;
        }

        .cat-btn:hover {
            background: var(--surface-hover);
            color: var(--text-main);
        }

        .cat-btn.active {
            background: var(--primary-accent);
            color: white;
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.4);
        }

        @media (min-width: 992px) {
            .cat-btn span {
                display: inline;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .cat-btn {
                padding: 8px 6px;
            }
        }

        @media (max-width: 768px) {
            .categories-bar {
                top: 53px;
                padding: 4px 6px;
            }
            .cat-btn {
                height: 34px;
                padding: 6px 1px;
                gap: 0;
            }
            .cat-btn svg {
                width: 17px;
                height: 17px;
            }
        }

        .lang-switch {
            display: inline-flex;
            background: var(--bg-page);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-full);
            padding: 2px;
            gap: 2px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .lang-btn:hover {
            color: var(--text-main);
        }

        .lang-btn.active {
            background: var(--primary-accent);
            color: white;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        .sidebar-title {
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .sidebar-close {
            background: var(--bg-page);
            border: 1px solid var(--border-light);
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition-smooth);
        }

        .sidebar-close:hover {
            background: var(--surface-hover);
            color: var(--text-main);
        }

        .menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .menu li {
            padding: 10px 14px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.92rem;
            color: var(--text-main);
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu li:hover {
            background: var(--bg-page);
            color: var(--primary-accent);
        }

        .menu li.active {
            background: var(--primary-accent);
            color: white;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        .layout {
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px 32px 64px 32px;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-light);
        }

        .content-header h2 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.8px;
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .content-header h2 svg {
            width: 28px;
            height: 28px;
            color: var(--primary-accent);
            flex-shrink: 0;
        }

        .menu li svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            color: var(--text-muted);
            transition: color 0.15s;
        }

        .menu li:hover svg {
            color: var(--primary-accent);
        }

        .menu li.active svg {
            color: white;
        }

        .status-text {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--surface);
            padding: 6px 14px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
        }

        .new-articles-pill {
            position: fixed;
            top: 76px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: var(--primary-accent);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-full);
            padding: 10px 22px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5);
            z-index: 900;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .new-articles-pill.show {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .new-articles-pill:hover {
            background: var(--primary-accent-hover);
            transform: translateX(-50%) translateY(-2px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            transition: var(--transition-smooth);
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-sm);
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .card.read {
            opacity: 0.45;
            filter: grayscale(40%);
        }

        @media (hover: hover) and (pointer: fine) {
            .card:hover {
                transform: translateY(-4px);
                border-color: rgba(59, 130, 246, 0.3);
                box-shadow: var(--shadow-lg);
            }

            .card.read:hover {
                opacity: 0.85;
                filter: grayscale(0%);
            }
        }

        .card-img-wrapper {
            position: relative;
            width: 100%;
            padding-top: 54%;
            background-color: #1f2937;
            overflow: hidden;
        }

        .card-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @media (hover: hover) and (pointer: fine) {
            .card:hover .card-img {
                transform: scale(1.04);
            }
        }

        .card-img-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #080c14;
            overflow: hidden;
            user-select: none;
        }

        .placeholder-ambient {
            position: absolute;
            inset: -30%;
            width: 160%;
            height: 160%;
            object-fit: cover;
            filter: blur(32px) saturate(220%) brightness(0.7);
            opacity: 0.6;
            pointer-events: none;
        }

        .placeholder-icon-wrap {
            position: relative;
            z-index: 2;
            width: 116px;
            height: 116px;
            border-radius: 28px;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.22);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 14px 34px -4px rgba(0, 0, 0, 0.85), 0 0 30px rgba(59, 130, 246, 0.25);
        }

        .placeholder-icon {
            width: 92px;
            height: 92px;
            object-fit: contain;
            border-radius: 18px;
        }

        .grid.list-view .placeholder-icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 20px;
        }

        .grid.list-view .placeholder-icon {
            width: 62px;
            height: 62px;
            border-radius: 14px;
        }

        .card-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .badges-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .card-badge {
            background: var(--bg-page);
            color: var(--text-muted);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-light);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .card-badge.accent {
            background: var(--accent-soft);
            color: var(--primary-accent);
            border-color: transparent;
        }

        .card-badge.accent.source-clickable {
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .card-badge.accent.source-clickable:hover {
            background: var(--primary-accent);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
            transform: scale(1.05);
        }

        .source-filter-bar {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 12px 18px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-sm);
        }

        .source-filter-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn-filter-back {
            background: var(--bg-page);
            border: 1px solid var(--border-light);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition-smooth);
        }

        .btn-filter-back:hover {
            background: var(--surface-hover);
            border-color: var(--primary-accent);
            color: var(--primary-accent);
        }

        .source-filter-title {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 1.15rem;
            color: var(--primary);
        }

        .source-filter-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .source-filter-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-source-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            background: var(--bg-page);
            border: 1px solid var(--border-light);
            transition: var(--transition-smooth);
        }

        .filter-source-toggle:hover {
            border-color: var(--primary-accent);
        }

        .filter-source-toggle input {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 1.5px solid #374151;
            border-radius: 6px;
            cursor: pointer;
            outline: none;
            display: inline-grid;
            place-content: center;
            transition: var(--transition-smooth);
            background: #1f2937;
            margin: 0;
        }

        .filter-source-toggle input:checked {
            background: var(--primary-accent);
            border-color: var(--primary-accent);
        }

        .filter-source-toggle input:checked::before {
            content: "";
            width: 10px;
            height: 6px;
            border-left: 2px solid white;
            border-bottom: 2px solid white;
            transform: rotate(-45deg) translate(1px, -1px);
        }

        .btn-filter-close {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn-filter-close:hover {
            background: var(--surface-hover);
            color: var(--text-main);
        }

        @media (max-width: 768px) {
            .source-filter-bar {
                padding: 10px 12px;
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .source-filter-left {
                justify-content: space-between;
            }
            .source-filter-right {
                justify-content: flex-end;
            }
        }

        .btn-translate {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            border-radius: var(--radius-sm);

        function normalizeArticleLink(url) {
            if (!url || typeof url !== 'string') return '';
            try {
                let clean = url.trim().replace(/&amp;/g, '&');
                try { clean = decodeURI(clean); } catch (e) {}
                clean = clean.split('#')[0].replace(/\/+$/, '');
                clean = clean.replace(/^http:\/\//i, 'https://');
                return clean;
            } catch (e) {
                return url.trim();
            }
        }

        try {

            if (savedRead) {
                const parsed = JSON.parse(savedRead);
                if (Array.isArray(parsed)) {
                    readArticles = new Set(parsed.map(normalizeArticleLink));
                }
            }
        } catch (e) {}

        function markAsRead(el) {
            if (!el) return;
            const rawLink = el.getAttribute('data-link') || el.getAttribute('href');
            const link = normalizeArticleLink(rawLink);
            if (!link || link === '#' || link.startsWith('intent:')) return;
            readArticles.add(link);
            el.classList.add('read');
            try {
                const arr = Array.from(readArticles).slice(-500);
                localStorage.setItem(STORAGE_READ_KEY, JSON.stringify(arr));
            } catch (e) {}

        function saveTranslationCache() {
            try {
                const keys = Object.keys(translationCache);
                if (keys.length > 600) {
                    keys.slice(0, keys.length - 600).forEach(k => delete translationCache[k]);
                }
                localStorage.setItem(STORAGE_TRANS_KEY, JSON.stringify(translationCache));
            } catch (e) {}
        }

        async function requestTranslation(text) {
            if (translationCache[text]) return translationCache[text];
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=sk&dt=t&q=${encodeURIComponent(text)}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error();
            const json = await res.json();
            if (json && json[0]) {
                const trans = json[0].map(p => p[0]).join('');
                if (trans) {
                    translationCache[text] = trans;
                    saveTranslationCache();
                    return trans;
                }
            }
            return text;
        }

        function applyTranslatedState(card, titleEl, btn, transText) {
            card.dataset.transTitle = transText;
            titleEl.textContent = transText;
            btn.classList.remove('loading');
            btn.classList.add('active');
            const span = btn.querySelector('span');
            if (span) span.textContent = 'EN';
            btn.setAttribute('aria-label', 'Zobraziť originál v angličtine');
            btn.title = 'Zobraziť originál v angličtine';
        }

        const autoTranslateObserver = new IntersectionObserver((entries) => {
            entries.forEach(async (entry) => {
                if (!entry.isIntersecting) return;
                const card = entry.target;
                autoTranslateObserver.unobserve(card);

                const btn = card.querySelector('.btn-translate');
                const titleEl = card.querySelector('.card-title');
                const origText = card.dataset.origTitle;
                if (!origText || !titleEl || !btn) return;

                if (translationCache[origText]) {
                    applyTranslatedState(card, titleEl, btn, translationCache[origText]);
                    return;
                }

                btn.classList.add('loading');
                try {
                    const trans = await requestTranslation(origText);
                    if (trans && trans !== origText) {
                        applyTranslatedState(card, titleEl, btn, trans);
                    } else {
                        btn.classList.remove('loading');
                    }
                } catch (err) {
                    btn.classList.remove('loading');
                    const span = btn.querySelector('span');
                    if (span) span.textContent = 'SK';
                }
            });
        }, { rootMargin: '300px 0px' });

        function toggleTranslation(e, btn) {
            e.preventDefault();
            e.stopPropagation();
            const card = btn.closest('.card');
            if (!card) return;
            const titleEl = card.querySelector('.card-title');
            if (!titleEl) return;

            const orig = card.dataset.origTitle;
            const trans = card.dataset.transTitle || translationCache[orig];

            if (btn.classList.contains('active')) {
                titleEl.textContent = orig;
                btn.classList.remove('active');
                const span = btn.querySelector('span');
                if (span) span.textContent = 'SK';
                btn.setAttribute('aria-label', 'Preložiť do slovenčiny');
                btn.title = 'Preložiť do slovenčiny';
            } else if (trans) {
                applyTranslatedState(card, titleEl, btn, trans);
            } else {
                autoTranslateObserver.observe(card);
            }

            sources.forEach(src => {
                const el = document.getElementById(src.id);
                if (el) el.checked = state;
            });
            triggerFetch();
        }

        function toggleGroup(groupName, state) {
            sources.filter(s => s.group === groupName).forEach(src => {
                const el = document.getElementById(src.id);
                if (el) el.checked = state;
            });
            triggerFetch();
        }

        function updateGroupCheckboxes() {
            const groups = [...new Set(sources.map(s => s.group))];
            groups.forEach(groupName => {
                const groupSources = sources.filter(s => s.group === groupName);
                const allChecked = groupSources.length > 0 && groupSources.every(s => {
                    const el = document.getElementById(s.id);
                    return el && el.checked;
                });
                const groupCb = document.getElementById(`group-cb-${groupName}`);
                if (groupCb) groupCb.checked = allChecked;
            });
        }

        function updateDropdownButton() {
            const checkedCount = getCheckedSources().length;
            const titleEl = document.getElementById('sources-sidebar-title');
            const t = i18n[currentLang];
            if (titleEl) {
                titleEl.innerText = `${t.sourcesTitle} (${checkedCount})`;
            }
            updateGroupCheckboxes();
        }

        function getCheckedSources() {
            return sources.filter(src => {
                const el = document.getElementById(src.id);
                return el && el.checked;
            });
        }

        function clearSourceFilter() {
            selectedSourceFilter = null;
            const banner = document.getElementById('source-filter-bar');
            if (banner) banner.style.display = 'none';
            const mainHeader = document.getElementById('main-content-header');
            if (mainHeader) mainHeader.style.display = 'flex';
            applyFilterAndRender(false);
        }

        window.addEventListener('popstate', (event) => {
            if (event.state && event.state.sourceFilter) {
                filterBySource(null, event.state.sourceFilter, false);
            } else {
                selectedSourceFilter = null;
                const banner = document.getElementById('source-filter-bar');
                if (banner) banner.style.display = 'none';
                const mainHeader = document.getElementById('main-content-header');
                if (mainHeader) mainHeader.style.display = 'flex';
                applyFilterAndRender(false);
            }
        });

        function filterBySource(e, sourceId, pushHistory = true) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            selectedSourceFilter = sourceId;
            
            if (pushHistory) {
                try {
                    history.pushState({ sourceFilter: sourceId }, '');
                } catch (err) {}
            }

            const banner = document.getElementById('source-filter-bar');
            const mainHeader = document.getElementById('main-content-header');
            const srcObj = sources.find(s => s.id === sourceId);
            const srcName = srcObj ? srcObj.name : 'Zdroj';

            if (banner) {
                const isChecked = getCheckedSources().some(s => s.id === sourceId);
                banner.innerHTML = `
                    <div class="source-filter-left">
                        <button class="btn-filter-back" onclick="goBackFromSourceFilter()" title="Späť na všetky správy" aria-label="Späť">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                            <span>Späť</span>
                        </button>
                        <div class="source-filter-title">
                            <span class="source-filter-label">Zdroj:</span>
                            <strong>${srcName}</strong>
                        </div>
                    </div>
                    <div class="source-filter-right">
                        <label class="filter-source-toggle" title="Zobraziť / skryť tento zdroj v aplikácii">
                            <input type="checkbox" id="filter-source-cb" ${isChecked ? 'checked' : ''} onchange="toggleActiveSourceCheckbox(this.checked)">
                        </label>
                        <button class="btn-filter-close" onclick="goBackFromSourceFilter()" title="Zavrieť filter" aria-label="Zavrieť">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                `;
                banner.style.display = 'flex';
            }
            if (mainHeader) mainHeader.style.display = 'none';

            window.scrollTo({ top: 0, behavior: 'smooth' });
            applyFilterAndRender(false);
        }

        function goBackFromSourceFilter() {
            if (window.history.state && window.history.state.sourceFilter) {
                window.history.back();
            } else {
                clearSourceFilter();
            }
        }

        function toggleActiveSourceCheckbox(state) {
            if (!selectedSourceFilter) return;
            const srcId = selectedSourceFilter;
            const cb = document.getElementById(srcId);
            if (cb) cb.checked = state;

            try {
                const saved = localStorage.getItem(STORAGE_SOURCES_KEY);
                let arr = saved ? JSON.parse(saved) : [];
                if (!Array.isArray(arr)) arr = [];
                if (state) {
                    if (!arr.includes(srcId)) arr.push(srcId);
                } else {
                    arr = arr.filter(id => id !== srcId);
                }
                localStorage.setItem(STORAGE_SOURCES_KEY, JSON.stringify(arr));
            } catch (e) {}

            saveSelectedSources();
            updateDropdownButton();
        }

        function showNewestArticles() {
            const pill = document.getElementById('new-articles-pill');
            if (pill) pill.classList.remove('show');
            clearSourceFilter();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function selectCategory(catId) {
            const pill = document.getElementById('new-articles-pill');
            if (pill) pill.classList.remove('show');

            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`cat-${catId}`)?.classList.add('active');
            activeCategory = catId;

            try {
                localStorage.setItem(STORAGE_CAT_KEY, catId);
            } catch (e) {}

            const catInfo = categories.find(c => c.id === catId);
            const catName = catInfo ? catInfo.name[currentLang] : '';
            document.getElementById('current-category-title').innerHTML = `${catInfo.icon} <span>${catName}</span>`;

            if (typeof clearSourceFilter === 'function') {
                clearSourceFilter();
            } else {
                applyFilterAndRender(false);
            }

            window.scrollTo(0, 0);
        }

        function triggerFetch() {
            saveSelectedSources();
            updateDropdownButton();
            applyFilterAndRender(false);
        }

        function cleanHtml(rawHtml, sourceName = '') {
            if (!rawHtml) return '';
            const doc = new DOMParser().parseFromString(rawHtml, 'text/html');
            let text = (doc.body.textContent || '').replace(/\s+/g, ' ').trim();
            if (sourceName && text.endsWith(sourceName)) {
                text = text.slice(0, -sourceName.length).replace(/[-–—|\s]+$/, '').trim();
            }
            return text.length > 150 ? text.substring(0, 150) + '...' : text;
        }

        function cleanTitle(rawTitle, sourceName = '') {
            if (!rawTitle) return 'Bez názvu';
            let title = rawTitle.trim();
            if (sourceName) {
                const parts = title.split(/\s+[-–—|]\s+/);
                if (parts.length > 1) {
                    const lastPart = parts[parts.length - 1].toLowerCase();
                    const srcLower = sourceName.toLowerCase().replace(/\.(sk|cz|com|uk|org)$/i, '');
                    if (lastPart.includes(srcLower) || srcLower.includes(lastPart)) {
                        parts.pop();
                        title = parts.join(' - ').trim();
                    }
                }
            }
            return title || 'Bez názvu';
        }

        function extractImageFromJson(item) {
            if (item.enclosure && item.enclosure.link && (!item.enclosure.type || item.enclosure.type.includes('image'))) {
                return item.enclosure.link;
            }
            if (item.thumbnail && item.thumbnail.startsWith('http')) return item.thumbnail;
            const content = (item.description || '') + ' ' + (item.content || '');
            const match = content.match(/<img[^>]+(?:src|data-src)=["'](https?:\/\/[^"'>\s]+)["']/i);
            if (match && match[1] && !match[1].includes('googleusercontent.com/J6_coFbogxh')) {
                return match[1];
            }
            return '';
        }

        function extractImageFromXmlItem(item, description) {
            const enclosure = item.querySelector('enclosure');
            if (enclosure) {
                const url = enclosure.getAttribute('url');
                if (url && url.startsWith('http')) return url;
            }

            const allWithUrl = item.querySelectorAll('[url]');
            for (const el of allWithUrl) {
                const url = el.getAttribute('url');
                if (url && url.startsWith('http') && !url.includes('googleusercontent.com/J6_coFbogxh')) {
                    const medium = el.getAttribute('medium') || '';
                    const type = el.getAttribute('type') || '';
                    if (medium === 'image' || type.includes('image') || /\.(jpe?g|png|webp|avif|gif)(\?.*)?$/i.test(url) || el.tagName.toLowerCase().includes('thumbnail') || el.tagName.toLowerCase().includes('content')) {
                        return url;
                    }
                }
            }

            let rawText = '';
            try {
                rawText = new XMLSerializer().serializeToString(item);
            } catch (e) {
                rawText = item.innerHTML || '';
            }
            rawText += ' ' + (description || '');

            const mediaMatch = rawText.match(/<(?:media:content|enclosure|media:thumbnail)[^>]+url=["'](https?:\/\/[^"'>\s]+)["']/i);
            if (mediaMatch && mediaMatch[1]) {
                return mediaMatch[1];
            }

            const imgMatches = rawText.matchAll(/<img[^>]+(?:src|data-src)=["'](https?:\/\/[^"'>\s]+)["']/gi);
            for (const m of imgMatches) {
                const u = m[1];
                if (!u.includes('googleusercontent.com/J6_coFbogxh') && !u.includes('pixel') && !u.includes('1x1') && !u.includes('tracker')) {
                    return u;
                }
            }

            return '';
        }

        function decodeAllOriginsContents(contents) {
            if (!contents || typeof contents !== 'string') return '';
            if (contents.startsWith('data:') && contents.includes(';base64,')) {
                try {
                    const base64 = contents.split(';base64,')[1];
                    const binStr = atob(base64);
                    const bytes = new Uint8Array(binStr.length);
                    for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                    return new TextDecoder('utf-8').decode(bytes);
                } catch (e) {
                    return '';
                }
            }
            return contents;
        }

        function parseXmlToArticles(xmlString, src) {
            if (!xmlString || typeof xmlString !== 'string') return [];
            const cleanedXml = xmlString.trim().replace(/^[^<]+/, '');
            if (!cleanedXml) return [];

            const parser = new DOMParser();
            let xmlDoc = parser.parseFromString(cleanedXml, "text/xml");
            let items = Array.from(xmlDoc.querySelectorAll("item, entry"));

            if (items.length === 0) {
                const sanitized = cleanedXml.replace(/&(?!(?:apos|quot|[gl]t|amp|#\d+|#x[0-9a-fA-F]+);)/g, '&amp;');
                xmlDoc = parser.parseFromString(sanitized, "text/xml");
                items = Array.from(xmlDoc.querySelectorAll("item, entry"));
            }

            if (items.length === 0) {
                xmlDoc = parser.parseFromString(cleanedXml, "text/html");
                items = Array.from(xmlDoc.querySelectorAll("item, entry"));
            }

            if (items.length === 0) return [];

            return items.slice(0, 25).map(item => {
                const rawTitle = item.querySelector('title')?.textContent || 'Bez názvu';
                const title = cleanTitle(rawTitle, src.name);

                let link = item.querySelector('link')?.textContent?.trim();
                if (!link) {
                    const linkEl = item.querySelector('link');
                    if (linkEl) {
                        link = linkEl.getAttribute('href') || linkEl.nextSibling?.nodeValue?.trim() || '';
                    }
                }
                if (!link || !link.startsWith('http')) {
                    const guid = item.querySelector('guid')?.textContent?.trim();
                    if (guid && guid.startsWith('http')) link = guid;
                }
                if (!link) link = '#';

                const pubDateRaw = item.querySelector('pubDate, pubdate, updated, published')?.textContent ||
                                   item.getElementsByTagName('dc:date')[0]?.textContent;
                const parsedDate = pubDateRaw ? new Date(pubDateRaw) : new Date();
                const description = item.querySelector('description, summary, content')?.textContent || '';

                const categoryTags = Array.from(item.querySelectorAll('category'))
                    .map(c => (c.textContent || c.getAttribute('term') || '').toLowerCase().trim())
                    .filter(Boolean);

                const cleanedDesc = cleanHtml(description, src.name);

                return {
                    sourceId: src.id,
                    sourceName: src.name,
                    sourceDefaultCats: src.defaultCats || [],
                    title: title,
                    link: link,
                    pubDate: isNaN(parsedDate.getTime()) ? new Date() : parsedDate,
                    description: cleanedDesc === title ? '' : cleanedDesc,
                    categories: categoryTags,
                    image: extractImageFromXmlItem(item, description)
                };
            });
        }

        async function loadArticles(isBackground = false) {
            const status = document.getElementById('status-text');
            const t = i18n[currentLang];
            if (!isBackground && status && rawArticlesCache.length === 0) {
                status.innerText = t.loading;
            }

            try {
                const bust = Date.now();
                let res;
                try {
                    res = await fetch(`https://raw.githubusercontent.com/tx738toxy01/newshub/main/feed.json?v=${bust}`, { cache: 'no-store' });
                    if (!res.ok) throw new Error();
                } catch (err) {
                    res = await fetch(`feed.json?v=${bust}`, { cache: 'no-store' });
                    if (!res.ok) throw new Error();
                }

                const data = await res.json();
                if (data && Array.isArray(data.sources) && data.sources.length > 0) {
                    sources = data.sources;
                    try {
                        localStorage.setItem('newshub_sources_data', JSON.stringify(sources));
                    } catch (e) {}
                    renderSourcesList();
                    updateDropdownButton();
                }

                if (data && Array.isArray(data.articles)) {
                    const now = Date.now();
                    rawArticlesCache = data.articles.map(a => {
                        const parsed = new Date(a.pubDate);
                        const safeDate = (isNaN(parsed.getTime()) || parsed.getTime() > now) ? new Date(now) : parsed;
                        return {
                            ...a,
                            pubDate: safeDate,
                            categories: Array.isArray(a.categories) ? a.categories : (a.category ? [a.category] : [])
                        };
                    });
                    rawArticlesCache.sort((a, b) => b.pubDate - a.pubDate);
                    saveCachedArticles();
                    applyFilterAndRender(false);
                }
            } catch (e) {
                if (!rawArticlesCache || rawArticlesCache.length === 0) {
                    loadCachedArticles();
                }
                applyFilterAndRender(false);
            }
        }

        function fetchNews() {
            loadArticles(false);
        }

        function getFilteredArticles() {
            if (selectedSourceFilter) {
                return rawArticlesCache.filter(a => a.sourceId === selectedSourceFilter);
            }

            const checkedSources = getCheckedSources();
            if (checkedSources.length === 0) return [];
            const checkedIds = new Set(checkedSources.map(s => s.id));
            let validArticles = rawArticlesCache.filter(a => checkedIds.has(a.sourceId));
            if (validArticles.length === 0) return [];

            if (activeCategory === 'all') {
                return validArticles;
            }

            const sourceCatsMap = new Map();
            sources.forEach(s => {
                if (s.defaultCats) sourceCatsMap.set(s.id, s.defaultCats);
            });

            return validArticles.filter(article => {
                const cats = (article.sourceDefaultCats && article.sourceDefaultCats.length > 0)
                    ? article.sourceDefaultCats
                    : (sourceCatsMap.get(article.sourceId) || []);
                return cats.includes(activeCategory);
            });
        }

        function applyFilterAndRender(isStillLoading = false, completed = 0, total = 0) {
            const grid = document.getElementById('news-grid');
            const status = document.getElementById('status-text');
            const checkedSources = getCheckedSources();
            const t = i18n[currentLang];

            if (checkedSources.length === 0) {
                grid.innerHTML = `<div class="empty-state">${t.selectSourceMsg}</div>`;
                status.innerText = t.noSource;
                return;
            }

            const checkedIds = new Set(checkedSources.map(s => s.id));
            let validArticles = rawArticlesCache.filter(a => checkedIds.has(a.sourceId));

            if (validArticles.length === 0) {
                if (!isStillLoading) {
                    grid.innerHTML = `<div class="empty-state">${t.blockedMsg}</div>`;
                    status.innerText = t.noSource;
                }
                return;
            }

            let filteredArticles = getFilteredArticles();

            if (filteredArticles.length === 0 && activeCategory !== 'all') {
                const catInfo = categories.find(c => c.id === activeCategory);
                const catName = catInfo ? catInfo.name[currentLang] : '';
                if (!isStillLoading) {
                    grid.innerHTML = `<div class="empty-state">${t.noCategoryArticles(catName)}</div>`;
                    status.innerText = t.shownCount(0);
                }
                articlesCache = [];
                return;
            }

            articlesCache = filteredArticles.slice(0, 300);
            if (isStillLoading) {
                status.innerText = `${t.updating} (${completed}/${total}) • ${t.shownCount(articlesCache.length)}`;
            } else {
                status.innerText = t.shownCount(articlesCache.length);
            }
            renderArticles();
        }

        function renderArticles() {
            const grid = document.getElementById('news-grid');

            if (articlesCache.length === 0) {
                return;
            }

            const t = i18n[currentLang];

            grid.innerHTML = articlesCache.map(article => {
                const dateObj = isNaN(article.pubDate) ? new Date() : article.pubDate;
                const dateStr = dateObj.toLocaleDateString(t.locale);
                const timeStr = dateObj.toLocaleTimeString(t.locale, { hour: '2-digit', minute: '2-digit' });

                const categoryBadge = article.categories.length > 0
                    ? `<span class="card-badge">${article.categories[0]}</span>`
                    : '';

                let hostDomain = '';
                try {
                    hostDomain = new URL(article.link).hostname;
                } catch (e) {}

                const faviconUrl = hostDomain
                    ? `https://www.google.com/s2/favicons?domain=${hostDomain}&sz=128`
                    : '';

                const placeholderMarkup = `
                    <div class="card-img-placeholder">
                        ${faviconUrl ? `<img src="${faviconUrl}" alt="" class="placeholder-ambient" loading="lazy"><div class="placeholder-icon-wrap"><img src="${faviconUrl}" alt="" class="placeholder-icon" loading="lazy"></div>` : ''}
                    </div>
                `;

                const safeImage = (article.image && !article.image.includes('unsplash.com')) ? article.image : '';

                const imageMarkup = safeImage
                    ? `<img src="${safeImage}" data-orig="${safeImage}" alt="" class="card-img" loading="lazy" referrerpolicy="no-referrer" onerror="if(!this.dataset.tried){this.dataset.tried=1; this.src='https://images.weserv.nl/?url='+encodeURIComponent(this.dataset.orig)+'&w=600';}else{this.style.display='none'; this.nextElementSibling.style.display='flex';}"><div class="card-img-placeholder" style="display:none;">${faviconUrl ? `<img src="${faviconUrl}" alt="" class="placeholder-ambient" loading="lazy"><div class="placeholder-icon-wrap"><img src="${faviconUrl}" alt="" class="placeholder-icon" loading="lazy"></div>` : ''}</div>`
                    : placeholderMarkup;

                const isRead = readArticles.has(normalizeArticleLink(article.link));
                const isEn = sources.some(s => s.id === article.sourceId && s.lang === 'en');
                const safeCardLink = (article.link || '').replace(/"/g, '&quot;');

                let titleToDisplay = article.title;
                let translateBtn = '';
                let extraCardClass = '';
                let extraDataAttrs = '';

                if (isEn) {
                    const safeOrigTitle = article.title.replace(/"/g, '&quot;');
                    const cachedTrans = translationCache[article.title];
                    if (cachedTrans) {
                        titleToDisplay = cachedTrans;
                        extraDataAttrs = `data-orig-title="${safeOrigTitle}" data-trans-title="${cachedTrans.replace(/"/g, '&quot;')}"`;
                        translateBtn = `<button type="button" class="btn-translate active" onclick="toggleTranslation(event, this)" title="Zobraziť originál v angličtine" aria-label="Zobraziť originál v angličtine"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg><span>EN</span></button>`;
                    } else {
                        extraCardClass = 'needs-auto-trans';
                        extraDataAttrs = `data-orig-title="${safeOrigTitle}"`;
                        translateBtn = `<button type="button" class="btn-translate loading" onclick="toggleTranslation(event, this)" title="Prekladá sa..." aria-label="Prekladá sa..."><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg><span>...</span></button>`;
                    }
                }

                return `
                    <a href="${article.link}" data-link="${safeCardLink}" target="_blank" rel="noopener noreferrer" onclick="markAsRead(this)" class="card ${isRead ? 'read' : ''} ${extraCardClass}" ${extraDataAttrs}>
                        <div class="card-img-wrapper">
                            ${imageMarkup}
                        </div>
                        <div class="card-content">
                            <div class="badges-row">
                                <span class="card-badge accent source-clickable" onclick="filterBySource(event, '${article.sourceId}')" title="Zobraziť všetky správy zo zdroja ${article.sourceName}">${article.sourceName}</span>
                                ${categoryBadge}
                            </div>
                            <h3 class="card-title">${titleToDisplay}</h3>
                            <p class="card-desc">${article.description}</p>
                            <div class="card-footer">
                                <span class="card-date">${dateStr} &bull; ${timeStr}</span>
                                ${translateBtn}
                            </div>
                        </div>
                    </a>
                `;
            }).join('');

            document.querySelectorAll('.needs-auto-trans').forEach(card => {
                autoTranslateObserver.observe(card);
            });
        }

        function syncReadStatus() {
            try {
                const savedRead = localStorage.getItem(STORAGE_READ_KEY);
                if (savedRead) {
                    const parsed = JSON.parse(savedRead);
                    if (Array.isArray(parsed)) {
                        readArticles = new Set(parsed.map(normalizeArticleLink));
                    }
                }
                document.querySelectorAll('.card').forEach(card => {
                    const rawLink = card.getAttribute('data-link') || card.getAttribute('href');
                    const link = normalizeArticleLink(rawLink);
                    if (link && readArticles.has(link)) {
                        card.classList.add('read');
                    }
                });
            } catch (e) {}
        }

        initUI();

        window.addEventListener('pageshow', () => {
            syncReadStatus();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                syncReadStatus();
                loadArticles(true);
            }
        });

        setInterval(() => {
            if (document.visibilityState === 'visible') {
                loadArticles(true);
            }
        }, 180000);
    </script>
