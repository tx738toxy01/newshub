<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsHub Widget</title>
    <meta name="theme-color" content="#090d16">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #090d16;
            --surface: #111827;
            --surface-hover: #1f2937;
            --primary: #f8fafc;
            --primary-accent: #3b82f6;
            --accent-soft: rgba(59, 130, 246, 0.16);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;
            --border-light: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            background-color: var(--bg-page);
            color: var(--text-main);
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .widget-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(9, 13, 22, 0.95);
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
        }

        .widget-brand {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            color: var(--primary);
        }

        .widget-badge {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #ffffff;
            font-weight: 800;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .widget-title {
            font-size: 0.92rem;
            font-weight: 800;
            letter-spacing: -0.4px;
        }

        .widget-title span {
            color: var(--primary-accent);
        }

        .widget-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .widget-status {
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-subtle);
            margin-right: 2px;
        }

        .w-btn {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            border: 1px solid var(--border-light);
            background: var(--surface);
            color: var(--text-main);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }

        .w-btn:hover {
            background: var(--surface-hover);
            color: var(--primary-accent);
        }

        .w-btn.spinning svg {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .widget-cats {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            padding: 5px 8px;
            background: #0c1220;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
        }

        .w-cat-btn {
            height: 28px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .w-cat-btn svg {
            width: 15px;
            height: 15px;
        }

        .w-cat-btn:hover {
            background: var(--surface-hover);
            color: var(--text-main);
        }

        .w-cat-btn.active {
            background: var(--primary-accent);
            color: #ffffff;
        }

        .widget-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .widget-list::-webkit-scrollbar {
            width: 4px;
        }

        .widget-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.14);
            border-radius: 4px;
        }

        .w-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: 10px;
            text-decoration: none;
            color: inherit;
            transition: background 0.2s, border-color 0.2s;
        }

        .w-item:hover {
            background: var(--surface-hover);
            border-color: rgba(59, 130, 246, 0.35);
        }

        .w-item.read {
            opacity: 0.45;
        }

        .w-thumb {
            position: relative;
            width: 64px;
            height: 50px;
            border-radius: 7px;
            background: #1f2937;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .w-thumb img.photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .w-thumb img.fav {
            width: 26px;
            height: 26px;
            object-fit: contain;
            border-radius: 6px;
        }

        .w-body {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .w-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .w-source {
            background: var(--accent-soft);
            color: var(--primary-accent);
            font-size: 0.62rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 5px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 55%;
        }

        .w-time {
            font-size: 0.64rem;
            font-weight: 600;
            color: var(--text-subtle);
            white-space: nowrap;
        }

        .w-headline {
            font-size: 0.82rem;
            font-weight: 700;
            line-height: 1.3;
            color: var(--primary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .w-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 32px 12px;
        }
    </style>
</head>
<body>

    <div class="widget-header">
        <a href="index.html" target="_blank" rel="noopener noreferrer" class="widget-brand">
            <div class="widget-badge">N</div>
            <div class="widget-title">News<span>Hub</span></div>
        </a>
        <div class="widget-actions">
            <span class="widget-status" id="w-status"></span>
            <button type="button" class="w-btn" id="w-refresh-btn" onclick="loadWidgetFeed(true)" aria-label="Obnoviť">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <polyline points="3 3 3 8 8 8"></polyline>
                    <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
                    <polyline points="16 16 21 16 21 21"></polyline>
                </svg>
            </button>
            <a href="index.html" target="_blank" rel="noopener noreferrer" class="w-btn" aria-label="Otvoriť NewsHub">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
            </a>
        </div>
    </div>

    <div class="widget-cats" id="w-cats"></div>
    <div class="widget-list" id="w-list">
        <div class="w-empty">Načítavam správy...</div>
    </div>

    <script>
        const categories = [
            { id: 'all', name: 'Najnovšie', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>' },
            { id: 'domov', name: 'Domáce', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>' },
            { id: 'cz', name: 'Česko', icon: '<svg viewBox="0 0 512 512" fill="currentColor"><path d="M396.032,390.354l-97.741-120.766c-9.312-11.733-14.673-26.438-15.1-41.412L276.953,8.59C276.818,3.807,272.9,0,268.115,0 H117.744c-2.441,0-4.774,1.01-6.446,2.79c-1.67,1.78-2.531,4.173-2.378,6.61l14.849,234.615l-19.517,43.913 c-6.539,14.712-6.637,31.63-0.269,46.416c6.367,14.786,18.726,26.34,33.909,31.698l49.753,17.56l95.249,104.127 c14.21,15.533,34.125,24.273,55.065,24.271c1.076,0,2.156-0.024,3.237-0.07c22.114-0.95,42.528-11.563,56.012-29.115 C418.326,455.322,417.842,417.301,396.032,390.354z M243.697,17.683h15.825l2.03,71.464h-17.855V17.683z M204.355,17.683h21.659 v71.464h-21.659V17.683z M186.672,17.683v71.464h-20.18l-4.35-71.464H186.672z M144.425,17.683l4.35,71.464h-17.09l-4.522-71.464 H144.425z M184.689,363.807l-40.913-14.44c-10.699-3.776-19.063-11.595-23.551-22.017c-4.488-10.422-4.422-21.871,0.186-32.24 l16.407-36.916c14.349,4.61,27.248,13.379,36.846,25.187c11.273,13.868,17.481,31.372,17.481,49.285 C191.146,343.44,188.932,354.035,184.689,363.807z M295.946,475.793l-95.355-104.239c5.407-12.182,8.239-25.422,8.239-38.888 c0-21.964-7.615-43.429-21.442-60.44c-11.964-14.718-28.119-25.594-46.085-31.168l-8.495-134.23h129.249l3.462,121.848 c0.534,18.785,7.268,37.233,18.958,51.945c0.018,0.021,0.033,0.041,0.049,0.061l97.763,120.793 c0.328,0.404,0.638,0.818,0.953,1.229c-41.757,1.694-77.933,31.593-86.504,73.907 C296.476,476.337,296.204,476.075,295.946,475.793z M383.184,472.044c-10.29,13.396-25.87,21.495-42.746,22.22 c-9.674,0.417-19.129-1.63-27.59-5.793c0.213-2.431,0.531-4.853,0.98-7.243c7.055-37.655,41.048-63.456,78.651-60.713 C397.83,437.764,394.758,456.976,383.184,472.044z"/></svg>' },
            { id: 'svet', name: 'Zahraničie', icon: '<svg viewBox="0 0 17 17" fill="currentColor"><path d="M8.516 0c-4.687 0-8.5 3.813-8.5 8.5s3.813 8.5 8.5 8.5 8.5-3.813 8.5-8.5-3.814-8.5-8.5-8.5zM1.041 9h2.937c0.044 1.024 0.211 2.031 0.513 3h-2.603c-0.481-0.906-0.776-1.923-0.847-3zM3.978 8h-2.937c0.071-1.077 0.366-2.094 0.847-3h2.6c-0.301 0.969-0.467 1.976-0.51 3zM5.547 5h5.896c0.33 0.965 0.522 1.972 0.569 3h-7.034c0.046-1.028 0.239-2.035 0.569-3zM4.978 9h7.035c-0.049 1.028-0.241 2.035-0.572 3h-5.891c-0.331-0.965-0.524-1.972-0.572-3zM13.013 9h2.978c-0.071 1.077-0.366 2.094-0.847 3h-2.644c0.302-0.969 0.469-1.976 0.513-3zM13.013 8c-0.043-1.024-0.209-2.031-0.51-3h2.641c0.48 0.906 0.775 1.923 0.847 3h-2.978zM14.502 4h-2.354c-0.392-0.955-0.916-1.858-1.55-2.7 1.578 0.457 2.938 1.42 3.904 2.7zM9.074 1.028c0.824 0.897 1.484 1.9 1.972 2.972h-5.102c0.487-1.071 1.146-2.073 1.97-2.97 0.199-0.015 0.398-0.030 0.602-0.030 0.188 0 0.373 0.015 0.558 0.028zM6.383 1.313c-0.629 0.838-1.151 1.737-1.54 2.687h-2.314c0.955-1.267 2.297-2.224 3.854-2.687zM2.529 13h2.317c0.391 0.951 0.915 1.851 1.547 2.689-1.561-0.461-2.907-1.419-3.864-2.689zM7.926 15.97c-0.826-0.897-1.488-1.899-1.978-2.97h5.094c-0.49 1.072-1.152 2.075-1.979 2.972-0.181 0.013-0.363 0.028-0.547 0.028-0.2 0-0.395-0.015-0.59-0.030zM10.587 15.703c0.636-0.842 1.164-1.747 1.557-2.703h2.358c-0.968 1.283-2.332 2.247-3.915 2.703z"/></svg>' },
            { id: 'ekonomika', name: 'Ekonomika', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>' },
            { id: 'sport', name: 'Šport', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H8c-.55 0-1 .45-1 1v1h10v-1c0-.55-.45-1-1-1h-1c-.55 0-1-.45-1-1v-2.34"></path><path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path></svg>' },
            { id: 'tech', name: 'Technológie', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>' },
            { id: 'gad', name: 'Gadgets', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>' },
            { id: 'pravica', name: 'Pravica', icon: '<svg viewBox="0 0 512 512" fill="currentColor"><path d="M36 248 Q42 224 66 218 Q76 196 102 190 Q114 168 140 162 Q152 140 178 134 Q190 112 216 106 Q228 84 254 78 Q266 58 292 52 Q314 40 342 42 L366 52 L396 62 L374 86 Q364 106 340 112 Q328 134 302 140 Q290 162 264 168 Q252 190 226 196 Q214 218 188 224 Q176 244 150 250 Q122 262 82 260 Q56 256 36 248 Z M234 202 C382 198 496 222 496 256 L496 404 C496 438 392 454 264 454 C136 454 32 438 32 404 L32 256 C32 251 35 247 40 244 L68 256 C92 276 170 288 264 288 C374 288 462 272 462 254 C462 236 364 220 224 220 Z M23 422 C23 456 131 476 264 476 C397 476 505 456 505 422 L495 416 C482 444 384 460 264 460 C144 460 46 444 33 416 Z"/></svg>' },
            { id: 'auto', name: 'Auto-Moto', icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></svg>' }
        ];

        const params = new URLSearchParams(window.location.search);
        let activeCategory = params.get('cat') || localStorage.getItem('newshub_widget_cat') || 'all';
        let sources = [];
        let articles = [];
        let categoryOverrides = {};
        let readArticles = new Set();

        try {
            const savedOrder = localStorage.getItem('newshub_cat_order');
            if (savedOrder) {
                const order = JSON.parse(savedOrder);
                if (Array.isArray(order)) {
                    categories.sort((a, b) => {
                        const idxA = order.indexOf(a.id);
                        const idxB = order.indexOf(b.id);
                        if (idxA === -1 && idxB === -1) return 0;
                        if (idxA === -1) return 1;
                        if (idxB === -1) return -1;
                        return idxA - idxB;
                    });
                }
            }
            const savedOverrides = localStorage.getItem('newshub_cat_overrides');
            if (savedOverrides) categoryOverrides = JSON.parse(savedOverrides);
            const savedRead = localStorage.getItem('newshub_read_articles');
            if (savedRead) readArticles = new Set(JSON.parse(savedRead));
        } catch (e) {}

        function renderCats() {
            const wrap = document.getElementById('w-cats');
            wrap.innerHTML = categories.map(cat => `
                <button type="button" class="w-cat-btn ${cat.id === activeCategory ? 'active' : ''}" onclick="selectWidgetCat('${cat.id}')" title="${cat.name}" aria-label="${cat.name}">
                    ${cat.icon}
                </button>
            `).join('');
        }

        function selectWidgetCat(catId) {
            activeCategory = catId;
            try {
                localStorage.setItem('newshub_widget_cat', catId);
            } catch (e) {}
            renderCats();
            renderList();
        }

        function getCategorySourceIds(catId) {
            if (categoryOverrides[catId]) return categoryOverrides[catId];
            if (catId === 'all') return sources.map(s => s.id);
            return sources.filter(s => {
                if (s.defaultCats && s.defaultCats.includes(catId)) return true;
                if (catId === 'cz' && (s.group === 'Česko' || String(s.id).startsWith('cz_'))) return true;
                return false;
            }).map(s => s.id);
        }

        function markRead(el, link) {
            el.classList.add('read');
            readArticles.add(link);
            try {
                localStorage.setItem('newshub_read_articles', JSON.stringify(Array.from(readArticles).slice(-500)));
            } catch (e) {}
        }

        function renderList() {
            const list = document.getElementById('w-list');
            const allowedIds = new Set(getCategorySourceIds(activeCategory));
            const filtered = (sources.length > 0 && allowedIds.size > 0)
                ? articles.filter(a => allowedIds.has(a.sourceId))
                : articles;

            if (filtered.length === 0) {
                list.innerHTML = '<div class="w-empty">V tejto sekcii zatiaľ nie sú žiadne správy.</div>';
                return;
            }

            list.innerHTML = filtered.slice(0, 40).map(a => {
                const dateObj = new Date(a.pubDate);
                const dateStr = isNaN(dateObj) ? '' : dateObj.toLocaleDateString('sk-SK', { day: 'numeric', month: 'short', year: 'numeric' });
                const timeStr = isNaN(dateObj) ? '' : dateObj.toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit', hour12: false });

                let host = '';
                try {
                    host = a.realDomain || new URL(a.link).hostname;
                } catch (e) {}
                const favUrl = host ? `https://www.google.com/s2/favicons?domain=${host}&sz=64` : '';
                const safeImg = (a.image && !a.image.includes('unsplash.com')) ? a.image : '';
                const thumbHtml = safeImg
                    ? `<img class="photo" src="${safeImg}" data-orig="${safeImg}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="if(!this.dataset.tried){this.dataset.tried=1;this.src='https://images.weserv.nl/?url='+encodeURIComponent(this.dataset.orig)+'&w=200';}else{this.outerHTML='${favUrl ? `<img class="fav" src="${favUrl}" alt="">` : ''}';}">`
                    : (favUrl ? `<img class="fav" src="${favUrl}" alt="" loading="lazy">` : '');

                const isRead = readArticles.has(a.link);
                const safeLink = (a.link || '#').replace(/"/g, '&quot;');

                return `
                    <a class="w-item ${isRead ? 'read' : ''}" href="${safeLink}" target="_blank" rel="noopener noreferrer" onclick="markRead(this, '${safeLink}')">
                        <div class="w-thumb">${thumbHtml}</div>
                        <div class="w-body">
                            <div class="w-meta">
                                <span class="w-source">${a.sourceName}</span>
                                <span class="w-time">${dateStr} &bull; ${timeStr}</span>
                            </div>
                            <div class="w-headline">${a.title}</div>
                        </div>
                    </a>
                `;
            }).join('');
        }

        async function loadWidgetFeed(manual = false) {
            const btn = document.getElementById('w-refresh-btn');
            const status = document.getElementById('w-status');
            if (btn) btn.classList.add('spinning');

            try {
                const bust = Date.now();
                let res;
                try {
                    res = await fetch(`https://raw.githubusercontent.com/tx738toxy01/newshub/main/feed.json?v=${bust}`, { cache: 'no-store' });
                    if (!res.ok) throw new Error();
                } catch (err) {
                    res = await fetch(`feed.json?v=${bust}`, { cache: 'no-store' });
                }
                const data = await res.json();
                if (data && Array.isArray(data.sources)) sources = data.sources;
                if (data && Array.isArray(data.articles)) {
                    articles = data.articles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
                }
                const now = new Date();
                if (status) {
                    status.textContent = now.toLocaleTimeString('sk-SK', { hour: '2-digit', minute: '2-digit', hour12: false });
                }
                renderList();
            } catch (e) {
                if (manual && status) status.textContent = 'Chyba';
            } finally {
                if (btn) btn.classList.remove('spinning');
            }
        }

        renderCats();
        loadWidgetFeed();
        setInterval(() => loadWidgetFeed(false), 180000);
    </script>
</body>
</html>
